# InputActions 配置 — stroke（笔画）版 + GNOME overlay
# 文档: https://wiki.inputactions.org
#
# 用法：按住鼠标右键画一个方向，然后松开。
# overlay.mouse_stroke 会驱动 GNOME Shell 扩展显示轨迹和动作名。
#
# 浏览器专用手势（切标签、关/开/恢复标签）只在下面的浏览器 class 下生效；
# 其余手势全局生效。要加别的浏览器，往 any 列表里加 class 即可。

overlay:
  mouse_stroke:
    enable: true
    # 斜向手势的角度容差（度）。方向落在 45°±该值内即匹配斜向模板，调大可放宽、调小可收紧。
    direction_tolerance: 18

device_rules:
  - conditions:
      all:
        - any:
            - $keyboard
            - $mouse
        - none:
            # 避免和 Input Remapper 的虚拟键盘抢设备
            - $name contains input-remapper
    grab: true
    ignore: false

  - conditions: $types != keyboard
    ignore: true

mouse:
  gestures:
    - type: stroke
      mouse_buttons: [ right ]

      gestures:
        # ---------------------------------------------------------- 浏览器专用
        - conditions:
            - any:
                - $window_class contains chrome
                - $window_class contains chromium
                - $window_class contains firefox
                - $window_class == Navigator
                - $window_class contains brave
                - $window_class contains edge
          gestures:
            # 向右划 -> 右侧标签页（Ctrl+PageDown）
            - id: 右侧标签页
              strokes: [ 'CjIAAFoyZAA=' ]
              actions:
                - input:
                    - keyboard: [ LEFTCTRL+PAGEDOWN ]

            # 向左划 -> 左侧标签页（Ctrl+PageUp）
            - id: 左侧标签页
              strokes: [ 'WjIAZAoyZGQ=' ]
              actions:
                - input:
                    - keyboard: [ LEFTCTRL+PAGEUP ]

            # 先上后右 -> 新标签页（Ctrl+T）
            - id: 新标签页
              strokes: [ 'CloAzgoKMgBaCmQA' ]
              actions:
                - input:
                    - keyboard: [ LEFTCTRL+T ]

            # 先左后下 -> 恢复刚关闭的标签页（Ctrl+Shift+T）
            - id: 恢复标签页
              strokes: [ 'WgoAZAoKMjIKWmQA' ]
              actions:
                - input:
                    - keyboard: [ LEFTCTRL+LEFTSHIFT+T ]

        # ---------------------------------------------------------------- 全局
        # 向上划 -> 滚动到顶部（Ctrl+Home）
        - id: 滚动到顶部
          strokes: [ 'MloAzjIKZM4=' ]
          actions:
            - input:
                - keyboard: [ LEFTCTRL+HOME ]

        # 向下划 -> 滚动到底部（Ctrl+End）
        - id: 滚动到底部
          strokes: [ 'MgoAMjJaZDI=' ]
          actions:
            - input:
                - keyboard: [ LEFTCTRL+END ]

        # 右上划 -> 窗口最大化（Super+Up）
        - id: 最大化
          strokes: [ 'CloA51oKZOc=' ]
          actions:
            - input:
                - keyboard: [ LEFTMETA+UP ]

        # 左上划 -> 截图（PrintScreen）
        - id: 截图
          strokes: [ 'WloAtQoKZLU=' ]
          actions:
            - input:
                - keyboard: [ PRINT ]

        # 右下划 -> 粘贴（Super+V）
        - id: 粘贴
          strokes: [ 'CgoAGVpaZBk=' ]
          actions:
            - input:
                - keyboard: [ LEFTMETA+V ]

        # 左下划 -> 还原窗口（Super+Down）
        - id: 还原窗口
          strokes: [ 'WgoASwpaZEs=' ]
          actions:
            - input:
                - keyboard: [ LEFTMETA+DOWN ]

        # 先左后右 -> 后退（Alt+Left）
        - id: 后退
          strokes: [ 'WjIAZAoyMgBaMmQA' ]
          actions:
            - input:
                - keyboard: [ LEFTALT+LEFT ]

        # 先右后左 -> 前进（Alt+Right）
        - id: 前进
          strokes: [ 'CjIAAFoyMmQKMmQA' ]
          actions:
            - input:
                - keyboard: [ LEFTALT+RIGHT ]

        # 先下后右 -> 关闭标签页（Ctrl+W，全局）
        - id: 关闭标签页
          strokes: [ 'CgoAMgpaMgBaWmQA' ]
          actions:
            - input:
                - keyboard: [ LEFTCTRL+W ]

# 想改成自己的笔画：运行 `inputactions record-stroke`，按住右键画一次，
# 把输出的 base64 替换到上面的 strokes 里即可。
