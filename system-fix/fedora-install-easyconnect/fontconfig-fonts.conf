<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- 旧版 Electron/Chromium 无法正确处理 Noto CJK 可变字体，排除它们 -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-noto-sans-cjk-vf-fonts/*</glob>
      <glob>/usr/share/fonts/google-noto-serif-cjk-vf-fonts/*</glob>
      <glob>/usr/share/fonts/google-noto-sans-mono-cjk-vf-fonts/*</glob>
    </rejectfont>
  </selectfont>

  <!-- 把 macOS / Windows 字体名映射到本机中文字体 -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>PingFang SC</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>PingFangSC-Regular</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>PingFangSC-Medium</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>PingFangSC-Semibold</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Microsoft Yahei</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Microsoft YaHei</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>宋体</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>SimSun</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- 默认 sans-serif 优先使用中文字体，保证回退可用 -->
  <match target="pattern">
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>

</fontconfig>
