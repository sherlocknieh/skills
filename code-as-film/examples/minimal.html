<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>code-as-film · minimal</title>
<style>
  html, body { margin: 0; height: 100%; background: #06070a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';

  /* ---- 契约：这四个全局量必须存在 ---- */
  const DUR = 6;
  const FPS = 30;

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d', { alpha: false });
  const SANS = '"Noto Sans CJK SC", "PingFang SC", sans-serif';
  const MONO = '"DejaVu Sans Mono", monospace';

  let W = 0, H = 0, U = 1;

  function resize() {
    W = Math.max(1, innerWidth);
    H = Math.max(1, innerHeight);
    cv.width = Math.round(W);
    cv.height = Math.round(H);
    U = H / 1080;                 // 所有尺寸乘 U，才能出 720p / 4K
  }

  /* 带种子的 PRNG：禁用 Math.random() */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const easeOutQuint = (p) => 1 - Math.pow(1 - clamp(p), 5);
  const easeInOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

  /* 逐帧从零绘制：一切只依赖 t */
  function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // 背景
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#07090f');
    g.addColorStop(1, '#0b0913');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 网格（随时间缓慢漂移）
    const step = 96 * U;
    const off = (t * 8 * U) % step;
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = Math.max(1, U);
    ctx.beginPath();
    for (let x = -step + off; x < W + step; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = -step + off; y < H + step; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    // 确定性粒子：位置直接由 t 算出，不累积状态
    const rnd = mulberry32(20261108);
    for (let i = 0; i < 40; i++) {
      const bx = rnd(), by = rnd(), sp = 0.2 + rnd() * 0.6;
      const x = ((bx + t * 0.02 * sp) % 1) * W;
      const y = (by + Math.sin(t * 0.8 + i) * 0.01) * H;
      ctx.fillStyle = `rgba(47,224,196,${0.10 + 0.25 * (0.5 + 0.5 * Math.sin(t * 2 + i))})`;
      ctx.beginPath();
      ctx.arc(x, y, (1.6 + sp * 2) * U, 0, Math.PI * 2);
      ctx.fill();
    }

    // 标题：逐字上浮
    const p = easeOutQuint(clamp((t - 0.15) / 1.2));
    const size = 120 * U;
    ctx.font = `700 ${size}px ${SANS}`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    const text = '代码即画面';
    const chars = [...text];
    let total = 0;
    for (const ch of chars) total += ctx.measureText(ch).width + 6 * U;

    let cx = W / 2 - (total - 6 * U) / 2;
    for (let i = 0; i < chars.length; i++) {
      const local = clamp((p - i * 0.08) / 0.7);
      const e = easeOutQuint(local);
      const w = ctx.measureText(chars[i]).width;
      if (e > 0.001) {
        ctx.save();
        ctx.globalAlpha = e;
        ctx.fillStyle = i < 2 ? '#ffffff' : '#2fe0c4';
        ctx.fillText(chars[i], cx, H / 2 - 10 * U + (1 - e) * 40 * U);
        ctx.restore();
      }
      cx += w + 6 * U;
    }

    // 副标题 + 下划线
    const p2 = easeOutQuint(clamp((t - 1.2) / 1.0));
    if (p2 > 0.001) {
      ctx.globalAlpha = p2 * 0.9;
      ctx.font = `400 ${22 * U}px ${MONO}`;
      ctx.fillStyle = '#7f889b';
      ctx.textAlign = 'center';
      ctx.fillText('EVERY FRAME IS A PURE FUNCTION OF T', W / 2, H / 2 + 92 * U);
      ctx.textAlign = 'left';

      ctx.strokeStyle = 'rgba(47,224,196,0.6)';
      ctx.lineWidth = 2 * U;
      const lw = 560 * U * easeInOutCubic(clamp((t - 1.0) / 1.4));
      ctx.beginPath();
      ctx.moveTo(W / 2 - lw / 2, H / 2 + 46 * U);
      ctx.lineTo(W / 2 + lw / 2, H / 2 + 46 * U);
      ctx.stroke();
    }

    // 转场条（第 5 秒划过）
    const sp = clamp((t - 4.6) / 0.8);
    if (sp > 0) {
      const x = (easeInOutCubic(sp) * 1.35 - 0.2) * W;
      ctx.fillStyle = 'rgba(139,123,255,0.55)';
      ctx.fillRect(x - 2 * U, 0, 4 * U, H);
    }

    // 结尾淡出
    const fade = clamp((t - 5.2) / 0.75);
    if (fade > 0) {
      ctx.fillStyle = `rgba(4,5,8,${easeInOutCubic(fade)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  window.DUR = DUR;
  window.FPS = FPS;
  window.EV = [{ t: 1.0, type: 'hit' }, { t: 4.6, type: 'swipe' }];
  window.render = render;
  window.READY = false;

  resize();
  addEventListener('resize', resize);

  const ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(() => { window.READY = true; });

  if (location.hash === '#preview') {
    const t0 = performance.now();
    const loop = () => {
      render(((performance.now() - t0) / 1000) % DUR);
      requestAnimationFrame(loop);
    };
    ready.then(loop);
  }
})();
</script>
</body>
</html>
