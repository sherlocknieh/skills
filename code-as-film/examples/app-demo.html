<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today</title>
<style>
  :root {
    --ink: #12151c; --dim: #7b8494; --line: #e4e7ee;
    --card: #ffffff; --bg: #f4f6f9; --accent: #1f8f7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #eaf3f1 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: "Noto Sans CJK SC", "PingFang SC", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 760px; background: var(--card); border-radius: 20px;
    box-shadow: 0 24px 60px rgba(20, 30, 50, .12), 0 2px 6px rgba(20, 30, 50, .05);
    padding: 34px 38px 26px;
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 30px; margin: 0; letter-spacing: .5px; }
  .date { color: var(--dim); font-size: 14px; }
  .row {
    display: flex; gap: 10px; padding: 8px 8px 8px 16px;
    border: 1.5px solid var(--line); border-radius: 14px;
    transition: border-color .25s, box-shadow .25s;
  }
  .row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(31, 143, 122, .12); }
  input {
    flex: 1; border: 0; outline: 0; font-size: 16px;
    font-family: inherit; background: transparent; color: var(--ink);
  }
  input::placeholder { color: #a8b0bd; }
  button#add {
    border: 0; cursor: pointer; width: 42px; height: 42px; border-radius: 10px;
    background: var(--ink); color: #fff; font-size: 22px; line-height: 1;
    transition: transform .15s, background .2s;
  }
  button#add:hover { background: #2a3140; }
  button#add:active { transform: scale(.94); }
  ul { list-style: none; margin: 24px 0 0; padding: 0; }
  li.task {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 6px; border-bottom: 1px solid var(--line);
    animation: enter .34s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .box {
    width: 22px; height: 22px; border-radius: 7px; border: 1.8px solid #c6cbd6;
    display: grid; place-items: center; cursor: pointer; flex: none;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .box:active { transform: scale(.9); }
  .box svg { opacity: 0; transform: scale(.5); transition: opacity .2s, transform .2s; }
  li.done .box { background: var(--accent); border-color: var(--accent); }
  li.done .box svg { opacity: 1; transform: none; }
  .title { font-size: 16px; transition: color .25s; }
  li.done .title { color: #9aa3b1; text-decoration: line-through; }
  .foot { display: flex; justify-content: space-between; margin-top: 18px; color: var(--dim); font-size: 13px; }
  .pill { background: #eef2f7; border-radius: 999px; padding: 5px 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h1>Today</h1>
      <div class="date">11 月 8 日 · 星期六</div>
    </div>

    <div class="row">
      <input id="new" placeholder="添加一件要做的事…" autocomplete="off">
      <button id="add" title="添加">+</button>
    </div>

    <ul id="list">
      <li class="task done">
        <span class="box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 6.8"/></svg></span>
        <span class="title">把发布片剪到 15 秒</span>
      </li>
      <li class="task">
        <span class="box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 6.8"/></svg></span>
        <span class="title">确认旁白的语气</span>
      </li>
      <li class="task">
        <span class="box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 6.8"/></svg></span>
        <span class="title">导出 4K 母版</span>
      </li>
    </ul>

    <div class="foot">
      <span class="pill" id="count">2 项待办</span>
      <span>本地保存 · 无需登录</span>
    </div>
  </div>

<script>
  const list = document.getElementById('list');
  const input = document.getElementById('new');
  const count = document.getElementById('count');

  const CHECK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 6.8"/></svg>';

  function refresh() {
    const n = list.querySelectorAll('li:not(.done)').length;
    count.textContent = n === 0 ? '全部完成' : `${n} 项待办`;
  }

  function addTask(text) {
    if (!text.trim()) return;
    const li = document.createElement('li');
    li.className = 'task';
    li.innerHTML = `<span class="box">${CHECK}</span><span class="title"></span>`;
    li.querySelector('.title').textContent = text.trim();
    list.appendChild(li);
    refresh();
  }

  document.getElementById('add').addEventListener('click', () => {
    addTask(input.value);
    input.value = '';
    input.focus();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      addTask(input.value);
      input.value = '';
    }
  });

  list.addEventListener('click', (e) => {
    const li = e.target.closest('li.task');
    if (!li) return;
    li.classList.toggle('done');
    refresh();
  });

  document.querySelectorAll('li.task .box').forEach((b) => b.addEventListener('click', () => {}));
  refresh();
</script>
</body>
</html>
